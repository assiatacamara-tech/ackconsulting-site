[build]
  command = "python3 build.py && python3 checks.py"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.11"

[build.processing.html]
  pretty_urls = true

# Les anciennes adresses sans « www » sont redirigées par Netlify (domaine principal : www.ackconsulting.fr)

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/docs/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[redirects]]
  from = "/formations/performance-commerciale"
  to = "/formations/prospection-commerciale"
  status = 301
  force = true

[[redirects]]
  from = "/catalogue-formations"
  to = "/assets/docs/catalogue-formations.pdf"
  status = 200

[[redirects]]
  from = "/documents/ACK_Catalogue_Formations.pdf"
  to = "/catalogue-formations"
  status = 301
  force = true
